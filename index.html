<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Профи.ру — Brand Graphics Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue: #849BFF;
  --blue-light: #E6EBFF;
  --blue-mid: #A9BAFD;
  --red: #FA2A48;
  --bg: #EDEFFF;
  --surface: #FFFFFF;
  --border: #DDE3F5;
  --text: #1A1A2E;
  --text-2: #8A90A8;
  --text-blue: #849BFF;
  --green: #0DB875;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.4;
}

/* ─── LAYOUT ─── */
.app {
  position: relative;
  min-height: 100vh;
  padding: 32px;
}

/* ─── LOGO ─── */
.logo {
  position: absolute;
  top: 32px;
  right: 40px;
  font-size: 24px;
  font-weight: 700;
  color: var(--red);
  letter-spacing: -0.5px;
  z-index: 10;
}

/* ─── SIDEBAR MENU ─── */
.menu {
  position: absolute;
  top: 32px;
  left: 32px;
  width: 145px;
  background: var(--blue-light);
  border-radius: 16px;
  padding: 8px;
  z-index: 10;
}
.menu-item {
  width: 100%;
  padding: 12px;
  border: none;
  background: transparent;
  border-radius: 10px;
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  font-weight: 400;
  color: var(--text);
  cursor: pointer;
  text-align: center;
}
.menu-item.active {
  background: var(--surface);
  font-weight: 500;
}
.menu-item.api-toggle {
  color: var(--text-blue);
  font-size: 14px;
}
.menu-keys {
  display: none;
  padding: 4px 4px 8px;
}
.menu-keys.open { display: block; }
.menu-key-label {
  font-size: 12px;
  color: var(--text-2);
  margin: 8px 0 4px;
}
.menu-key-input {
  width: 100%;
  background: var(--surface);
  border: none;
  border-radius: 8px;
  padding: 10px;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: var(--text);
}
.menu-key-input::placeholder { color: var(--blue-mid); }

/* ─── CENTER STAGE ─── */
.stage {
  max-width: 740px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding-bottom: 140px;
}

/* ─── EMPTY STATE VISUAL (COLLAGE) ─── */
.collage {
  position: relative;
  height: 460px;
  width: 1240px;
  max-width: 90vw;
  margin: 40px auto 24px;
  left: 50%;
  transform: translateX(-50%);
}
.empty-card {
  position: absolute;
  top: 40px;
  width: 340px; height: 340px;
  border-radius: 36px;
  overflow: hidden;
  opacity: 0;
  transform: translateY(80px) scale(0.85) rotate(0deg);
}
.empty-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-illus { left: 20px; }
.card-photo { left: 380px; z-index: 2; }
.card-collage { left: 740px; }
/* появление (запускается добавлением класса .on через JS) */
.card-illus.on {
  opacity: 1;
  transform: translateY(0) scale(1) rotate(-6deg);
  transition: transform .7s cubic-bezier(.2,1.4,.4,1) 0s, opacity .5s ease 0s;
}
.card-photo.on {
  opacity: 1;
  transform: translateY(0) scale(1) rotate(-1deg);
  transition: transform .7s cubic-bezier(.2,1.4,.4,1) .12s, opacity .5s ease .12s;
}
.card-collage.on {
  opacity: 1;
  transform: translateY(0) scale(1) rotate(5deg);
  transition: transform .7s cubic-bezier(.2,1.4,.4,1) .24s, opacity .5s ease .24s;
}
/* покачивание после появления */
.empty-card.on.card-illus   { animation: floatCard1 3.4s ease-in-out infinite 0.7s; }
.empty-card.on.card-photo   { animation: floatCard2 3.4s ease-in-out infinite 0.82s; }
.empty-card.on.card-collage { animation: floatCard3 3.4s ease-in-out infinite 0.94s; }
@keyframes floatCard1 { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-16px) rotate(-4deg); } }
@keyframes floatCard2 { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-20px) rotate(1deg); } }
@keyframes floatCard3 { 0%,100% { transform: translateY(0) rotate(5deg); } 50% { transform: translateY(-14px) rotate(7deg); } }
/* бабблы */
.empty-bubble { position: absolute; opacity: 0; transform: scale(0.7); }
.empty-bubble img { width: 100%; display: block; }
.bubble-1 { bottom: -12px; left: 0; width: 440px; }
.bubble-2 { top: -32px; right: 20px; width: 420px; }
.empty-bubble.on {
  opacity: 1;
  transform: scale(1);
  transition: transform .5s ease .5s, opacity .5s ease .5s;
}
.bubble-2.on { transition-delay: .65s; }

/* ─── BOTTOM INPUT PANEL ─── */
.input-panel {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  width: 740px;
  max-width: calc(100vw - 64px);
  background: var(--surface);
  border-radius: 20px;
  padding: 24px;
  z-index: 20;
}
.input-field {
  width: 100%;
  border: none;
  resize: none;
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  color: var(--text);
  background: transparent;
  min-height: 48px;
  margin-bottom: 32px;
}
.input-field::placeholder { color: var(--text-2); }
.input-field:focus { outline: none; }

.controls-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: nowrap;
}
.chips-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  flex: 1;
  min-width: 0;
}
.chip {
  border: none;
  background: var(--blue-light);
  color: var(--text-blue);
  border-radius: 10px;
  padding: 10px 14px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 400;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.chip.on {
  background: var(--blue-mid);
  color: var(--surface);
}
.chip-icon { width: 14px; height: 14px; display: inline-block; }

.spacer { flex: 1; }

.gen-btn {
  border: none;
  background: var(--red);
  color: #fff;
  border-radius: 12px;
  padding: 12px 24px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  align-self: center;
}
.gen-btn:disabled { cursor: not-allowed; }
.gen-btn.loading { opacity: 0.6; cursor: wait; }

/* mode-specific chip groups hidden by default */
.chip-group { display: none; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip-group.active { display: flex; }

/* ─── LOADING CARD ─── */
.loading-card {
  display: none;
  width: 740px;
  max-width: 100%;
  background: var(--surface);
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  margin: 0 auto;
}
.loading-card.on { display: block; }
.loading-spark {
  width: 32px; height: 32px;
  margin: 0 auto 16px;
  color: var(--blue);
}
.loading-text { font-size: 16px; color: var(--text); margin-bottom: 6px; }
.loading-sub { font-size: 14px; color: var(--text-2); }

/* ─── RESULTS ─── */
.results-wrap {
  width: 740px;
  max-width: 100%;
  margin: 0 auto;
}
.prompt-card {
  display: none;
  background: var(--surface);
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 20px;
}
.prompt-card.on { display: block; }
.prompt-text {
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  max-height: 90px;
  overflow: hidden;
  margin-bottom: 12px;
}
.prompt-copy {
  border: none;
  background: transparent;
  color: var(--text-blue);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  cursor: pointer;
  padding: 0;
}
.results-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.result-card {
  background: var(--surface);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
}
.result-card img { width: 100%; display: block; }
.result-card.single { grid-column: 1 / -1; max-width: 460px; margin: 0 auto; }

/* ─── LIGHTBOX ─── */
.lightbox {
  display: none;
  position: fixed; inset: 0;
  background: rgba(40,40,50,0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 40px;
}
.lightbox.on { display: flex; }
.lightbox-img { max-width: 90vw; max-height: 78vh; border-radius: 8px; }
.lightbox-close {
  position: absolute; top: 24px; right: 32px;
  background: none; border: none; color: #fff;
  font-size: 28px; cursor: pointer;
}
.lightbox-actions {
  position: absolute; bottom: 40px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 24px;
}
.lightbox-btn {
  border: none; background: var(--surface);
  color: var(--text-blue);
  border-radius: 12px; padding: 14px 24px;
  font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
  text-decoration: none;
}

/* ─── BRAND CHECK ─── */
.bc-upload {
  border: 2px dashed var(--border);
  border-radius: 16px;
  padding: 40px;
  text-align: center;
  cursor: pointer;
  background: var(--surface);
  width: 740px; max-width: 100%;
  margin: 0 auto;
}
.bc-upload-text { font-size: 16px; color: var(--text); margin-top: 8px; }
.bc-upload-hint { font-size: 14px; color: var(--text-2); margin-top: 4px; }
.bc-result {
  background: var(--surface);
  border-radius: 20px;
  overflow: hidden;
  width: 740px; max-width: 100%;
  margin: 0 auto;
}
.bc-score-header {
  display: flex; align-items: center; gap: 20px;
  padding: 24px; background: var(--blue-light);
}
.bc-score-circle {
  width: 64px; height: 64px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 700; flex-shrink: 0;
  background: var(--surface);
}
.bc-score-circle.high { color: var(--green); }
.bc-score-circle.mid { color: #F59E0B; }
.bc-score-circle.low { color: var(--red); }
.bc-verdict h3 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.bc-verdict p { font-size: 14px; color: var(--text-2); }
.bc-list { padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
.bc-item { display: flex; gap: 12px; padding: 12px; border-radius: 10px; background: var(--bg); }
.bc-item h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.bc-item p { font-size: 13px; color: var(--text-2); }

/* error */
.err-card {
  display: none;
  background: #FFF1F3; color: var(--red);
  border-radius: 12px; padding: 14px 18px;
  font-size: 14px;
  width: 740px; max-width: 100%; margin: 0 auto 16px;
}
.err-card.on { display: block; }

.hidden { display: none !important; }
</style>
</head>
<body>

<div class="app">
  <div class="logo"><img src="assets/logo.svg" alt="Профи.ру" style="height:24px;display:block"></div>

  <!-- MENU -->
  <nav class="menu">
    <button class="menu-item active" onclick="setMode('illustration', this)">Иллюстрация</button>
    <button class="menu-item" onclick="setMode('photo', this)">Фото</button>
    <button class="menu-item" onclick="setMode('collage', this)">Коллаж</button>
    <button class="menu-item" onclick="setMode('brandcheck', this)">Чек макета</button>
    <button class="menu-item api-toggle" onclick="toggleApiKeys(this)">Ключи API ⌄</button>
    <div class="menu-keys" id="menu-keys">
      <div class="menu-key-label" id="api-status-text">Claude API</div>
      <input type="password" class="menu-key-input" id="api-key" placeholder="sk-ant-..." oninput="checkApiKey()" autocomplete="off">
      <div class="menu-key-label" id="krea-status-text">Krea API</div>
      <input type="password" class="menu-key-input" id="krea-key" placeholder="Krea key..." oninput="checkKreaKey()" autocomplete="off">
      <label style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-2);margin-top:8px;cursor:pointer">
        <input type="checkbox" id="remember-key" onchange="toggleRemember()" style="width:13px;height:13px">
        Запомнить
      </label>
    </div>
  </nav>

  <!-- CENTER STAGE -->
  <div class="stage">

    <!-- Collage (empty state / home) -->
    <div class="collage" id="empty-state">
      <div class="empty-card card-illus"><img src="assets/illustration-umbrella.png" alt=""></div>
      <div class="empty-card card-photo"><img src="assets/photo-cat.png" alt=""></div>
      <div class="empty-card card-collage"><img src="assets/photo-reading.png" alt=""></div>
      <div class="empty-bubble bubble-1"><img src="assets/bubble-illustration.svg" alt="иллюстрации в фирменном стиле"></div>
      <div class="empty-bubble bubble-2"><img src="assets/bubble-photo.svg" alt="фото и коллажи по брендбуку"></div>
    </div>

    <!-- Loading -->
    <div class="loading-card" id="loading">
      <svg class="loading-spark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.5 6.5L20 10l-6.5 1.5L12 18l-1.5-6.5L4 10l6.5-1.5z"/></svg>
      <div class="loading-text" id="load-text">Генерирую...</div>
      <div class="loading-sub" id="load-sub">Krea Nano Banana 2</div>
    </div>

    <!-- Results -->
    <div class="results-wrap">
      <div class="err-card" id="err-card"></div>
      <div class="prompt-card" id="prompt-preview">
        <div class="prompt-text" id="pp-text"></div>
        <button class="prompt-copy" onclick="copyPrompt()">Скопировать промпт</button>
      </div>
      <div class="results-grid" id="results-grid"></div>
    </div>

  </div>

  <!-- BOTTOM INPUT PANEL -->
  <div class="input-panel" id="input-panel">
    <!-- illustration -->
    <textarea class="input-field mode-input" id="il-topic" data-mode="illustration"
      placeholder="Опишите тему или сюжет, например будильник классической формы или свинка-копилка в которую падает монетка"></textarea>
    <!-- photo -->
    <textarea class="input-field mode-input hidden" id="ph-topic" data-mode="photo"
      placeholder="Например: мастер сантехник чинит кран на кухне, рядом с ним женщина пользователь Профи.ру, в руках у нее планшет"></textarea>
    <!-- collage -->
    <textarea class="input-field mode-input hidden" id="co-topic" data-mode="collage"
      placeholder="Например: скидка на уборку 30%, новый сезон, акция для новых клиентов"></textarea>
    <!-- brandcheck upload trigger -->
    <div class="mode-input hidden" data-mode="brandcheck" id="bc-inline">
      <input type="file" id="bc-file-input" accept="image/*" style="display:none" onchange="handleBrandCheckFile(event)">
      <div style="font-size:16px;color:var(--text-2);min-height:48px;display:flex;align-items:center;cursor:pointer" onclick="document.getElementById('bc-file-input').click()">
        Нажмите чтобы загрузить макет для проверки на соответствие брендбуку
      </div>
    </div>

    <div class="controls-row">
      <div class="chips-wrap">
      <!-- ILLUSTRATION controls -->
      <div class="chip-group active" data-mode="illustration">
        <button class="chip" onclick="toggleChip(this)">Спарклы <svg class="chip-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.5 6.5L20 10l-6.5 1.5L12 18l-1.5-6.5L4 10l6.5-1.5z"/></svg></button>
        <button class="chip" onclick="toggleChip(this)">Облака <svg class="chip-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18h11a4 4 0 000-8 5 5 0 00-9.5-1.5A3.5 3.5 0 006 18z"/></svg></button>
        <button class="chip" onclick="toggleChip(this)">Монетки <svg class="chip-icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="7"/></svg></button>
        <button class="chip solo on" onclick="soloChip(this,'il-ratio')">1:1 <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
        <button class="chip solo" onclick="soloChip(this,'il-ratio')">9:16 <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="4" width="8" height="16" rx="2"/></svg></button>
        <button class="chip solo" onclick="soloChip(this,'il-ratio')">16:9 <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="8" width="16" height="8" rx="2"/></svg></button>
      </div>
      <!-- PHOTO controls -->
      <div class="chip-group" data-mode="photo">
        <button class="chip on" onclick="toggleChip(this)">Комфорт</button>
        <button class="chip" onclick="toggleChip(this)">Доверие</button>
        <button class="chip" onclick="toggleChip(this)">Сдержанность</button>
        <button class="chip" onclick="toggleChip(this)">Уют</button>
        <button class="chip solo on" onclick="soloChip(this,'ph-ratio')">1:1 <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
        <button class="chip solo" onclick="soloChip(this,'ph-ratio')">4:5 <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="4" width="10" height="16" rx="2"/></svg></button>
        <button class="chip solo" onclick="soloChip(this,'ph-ratio')">3:2 <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="2"/></svg></button>
        <button class="chip solo" onclick="soloChip(this,'ph-ratio')">16:9 <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="8" width="16" height="8" rx="2"/></svg></button>
      </div>
      <!-- COLLAGE controls -->
      <div class="chip-group" data-mode="collage">
        <button class="chip solo on" onclick="soloChip(this,'co-ratio')">1:1</button>
        <button class="chip solo" onclick="soloChip(this,'co-ratio')">4:5</button>
        <button class="chip solo" onclick="soloChip(this,'co-ratio')">16:9</button>
      </div>
      <!-- BRANDCHECK controls (empty) -->
      <div class="chip-group" data-mode="brandcheck"></div>
      </div>

      <button class="gen-btn" onclick="currentMode==='brandcheck'?runBrandCheck():generate()" id="gen-btn">
        <span id="gen-btn-text">Сгенерировать</span>
      </button>
    </div>
  </div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
  <div class="lightbox-actions">
    <a class="lightbox-btn" id="lightbox-download" download="profi-image.png" href="#">Скачать изображение ↓</a>
    <button class="lightbox-btn" onclick="copyPrompt()">Скопировать промпт ⧉</button>
  </div>
</div>

<script>
// Hidden fields the original script expects but new design places elsewhere
</script>

<script>
// ─── BRAND JSON TOKENS ───
const BRAND_TOKENS = {
  illustration: {
    style_name: "Profi.ru illustrations style",
    visual_language: "minimal geometric pseudo-3D illustration",
    color_palette: {
      primary_gradient: { start: "#E6EBFF", end: "#849BFF" },
      accent_gradient: { start: "#FE6B81", end: "#FA2A48" },
      neutral_colors: ["#D9DDF0", "#C7CCE8", "#EEF1FF"]
    },
    texture: { noise: true, noise_type: "fine_grain", noise_strength: "strong_in_dark_areas", noise_fade: "towards_light_areas" },
    geometry: { primitive_based: true, rounded_shapes: true, outline: false, faceted_surfaces: true },
    lighting: { type: "stylized", direction: "top-left", realistic_shadows: false },
    rendering: { flat_3d: true, soft_gradients: true, clean_edges: true, friendly: true, playful: true, high_abstraction: true },
    base_prompt: `Create an illustration in Profi.ru brand style. Style: soft geometric pseudo-3D illustration. Construct all objects from simple geometric shapes with large rounded forms and clean silhouettes. No outlines. Volume is created only through soft linear gradients, faceted surfaces and subtle grain texture. Use the primary brand gradient as the main fill: light blue #E6EBFF → periwinkle blue #849BFF. Use accent elements with a secondary gradient: pink-red #FE6B81 → vivid red #FA2A48. Lighting is stylized and consistent from the top-left direction. No realistic shadows, reflections, glossy materials. Apply fine-grain noise texture across all colored surfaces — strongest in darker areas, fades toward lighter areas. flat 3D appearance, geometric construction, soft rounded corners, friendly and approachable, minimal details, clean composition, high abstraction, modern digital product illustration. Transparent background. Avoid: realistic lighting, hard shadows, outlines, strokes, glass effects, metallic materials, photorealism, excessive details.`
  },
  photo: {
    style_name: "Profi Human Lifestyle",
    emotion: { primary: ["comfort", "trust", "support", "calm", "confidence"], avoid: ["corporate success", "luxury", "exaggerated happiness"] },
    lighting: { type: "natural daylight", contrast: "low", shadows: "soft", temperature: "slightly cool", studio_look: false },
    color_palette: { base: ["#FFFFFF", "#F5F7FB", "#E6EBFF", "#A9BAFD"], accent: ["#FA2A48"] },
    post_processing: { exposure: "bright", white_balance: "slightly cool", saturation: "moderately reduced", grain: "minimal" },

let bcImageBase64 = null;

function handleBrandCheckFile(event) {
  const _safe = (id) => document.getElementById(id);
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    bcImageBase64 = e.target.result.split(',')[1];
    if(_safe('bc-preview-img')) _safe('bc-preview-img').src = e.target.result;
    if(_safe('bc-preview-wrap')) _safe('bc-preview-wrap').style.display = 'block';
    if(_safe('bc-upload-zone')) _safe('bc-upload-zone').style.display = 'none';
  const bi = document.getElementById('bc-inline'); if(bi){ bi.querySelector('div').textContent = 'Макет загружен: ' + (event.target.files[0]?.name || 'изображение') + ' — нажмите «Проверить макет»'; }
  };
  reader.readAsDataURL(file);
}

function clearBrandCheckFile() {
  bcImageBase64 = null;
  document.getElementById('bc-file-input').value = '';
  document.getElementById('bc-preview-wrap').style.display = 'none';
  document.getElementById('bc-upload-zone').style.display = 'block';
}

// Drag-and-drop support for upload zone
document.addEventListener('DOMContentLoaded', () => {
  const zone = document.getElementById('bc-upload-zone');
  if (!zone) return;
  if (!zone) return;
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (!file || !file.type.startsWith('image/')) return;
    document.getElementById('bc-file-input').files = e.dataTransfer.files;
    handleBrandCheckFile({ target: { files: e.dataTransfer.files } });
  });
});

async function runBrandCheck() {
  const apiKey = document.getElementById('api-key').value.trim();
  if (!apiKey) return;
  if (!bcImageBase64) {
    showErr('Загрузи изображение макета для проверки');

  const systemPrompt = `Ты — эксперт по брендингу Профи.ру. Анализируй макеты строго по брендбуку компании.

БРЕНДБУК ПРОФИ.РУ:
**Цвета:**
- Основной градиент: #E6EBFF → #849BFF (синий-фиолетовый)
- Акцентный градиент: #FE6B81 → #FA2A48 (красный)
- Нейтральные: #D9DDF0, #C7CCE8, #EEF1FF
- Фон: #FFFFFF или #E6EBFF
- Текст: #181C2E

**Типографика:**
- Один шрифт без засечек
- Иерархия: крупный жирный заголовок, средний подзаголовок, мелкий текст
- Без декоративных и рукописных шрифтов

**Иллюстративный стиль:**
- Геометрические формы, скруглённые углы, без контуров

- Один визуальный центр
- Нет перегруженности

Отвечай СТРОГО в JSON-формате без markdown-обёртки:
{

  "items": [
    { "category": "<название>", "status": "<ok|warn|fail>", "comment": "<комментарий>" }

  const userContent = [
    {

      source: { type: "base64", media_type: "image/png", data: bcImageBase64 }
    },
    {
      type: "text",
      text: `Проверь этот макет на соответствие брендбуку Профи.ру.

${context ? 'Контекст: ' + context : ''}
Верни только JSON.`

// ─── GENERATE ───
async function generate() {
  const apiKey = document.getElementById('api-key').value.trim();
  if (!apiKey) {
    showErr('Сначала введите Claude API-ключ в меню «Ключи API» слева');
    document.getElementById('menu-keys')?.classList.add('open');
    return;
  }
  const topic = getTopic();
  if (!topic || !topic.trim()) {
    showErr('Опишите тему или сюжет в поле выше');
    document.querySelector('.mode-input.active, .mode-input[data-mode="'+currentMode+'"]')?.focus();
    return;
  }

  clearErr();
  showLoading(true);
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('results-grid').innerHTML = '';
  document.getElementById('prompt-preview').classList.remove('on');

  try {
    setLoadStep(1, 'Строю промпт из токенов...', 'Claude читает брендбук');
    const prompt = await buildPrompt(apiKey);
    lastPrompt = prompt;
    saveHistory(currentMode, getTopic(), prompt);

    const kreaKey = document.getElementById('krea-key').value.trim();

    if (kreaKey) {
      setLoadStep(2, 'Промпт готов! Генерирую вариант 1 из 2...', 'Krea Nano Banana 2');
      try {
        const imageUrls = [];
        const errors = [];

        // Generate sequentially — one at a time, avoids Vercel concurrency limits
        for (let i = 0; i < 2; i++) {
          setLoadStep(2, `Промпт готов! Генерирую вариант ${i + 1} из 2...`, 'Krea Nano Banana 2');
          try {
            const url = await generateWithKrea(kreaKey, prompt);
            imageUrls.push(url);
          } catch (e) {
            errors.push(e.message);
          }
        }

        setLoadStep(3, 'Готово!', '');
        showLoading(false);

        if (imageUrls.length === 0) {
          throw new Error(errors.join(' | '));
        }
        renderResultsWithImages(prompt, imageUrls);
        if (errors.length) {
          showErr('Krea (1 вариант не удался): ' + errors.join(' | '));
        }
      } catch(e) {
        setLoadStep(3, 'Промпт готов', '');
        showLoading(false);
        renderResults(prompt);
        showErr('Krea: ' + e.message);
      }
    } else {
      setLoadStep(2, 'Промпт готов!', 'Подключи Krea для генерации изображений');
      await new Promise(r => setTimeout(r, 600));
      setLoadStep(3, 'Финальная обработка...', '');
      showLoading(false);
      renderResults(prompt);
    }

    document.getElementById('pp-text').textContent = prompt;
    document.getElementById('prompt-preview').classList.add('on');

  } catch(e) {
    showLoading(false);
    showErr('Ошибка: ' + e.message + '. Проверь API ключ и попробуй снова.');
    document.getElementById('empty-state').style.display = 'block';
  }
}

Base style: "${tokens.base_prompt}"

Create a specific photo prompt for:
Scene: ${topic}

Write ONLY the final English prompt (60-100 words). Be specific about the scene, people, light and environment. End with: "profi.ru lifestyle photo style, natural daylight, #E6EBFF color atmosphere, slightly cool tone, bright exposure, documentary".`;

Create a specific collage prompt for:
Topic: ${topic}
Main subject: ${hero}
Decorative elements: ${deco || 'subtle sparkles'}

Channel/format: ${channel}

Write ONLY the final English prompt (60-100 words). Describe exact composition, subject placement, decorative details and color usage. End with: "profi.ru brand collage style, #E6EBFF background, #FF4B55 accent, clean asymmetrical layout, no outlines around objects".`;
  }

    method: 'POST',

async function generateWithKrea(kreaKey, prompt) {
  // Call via Netlify serverless proxy (avoids CORS)
  // Map button text to valid Krea aspect ratio values
  const ratioMap = { '1:1': '1:1', '4:5': '4:5', '9:16': '9:16', '16:9': '16:9', '3:2': '3:2', '2:3': '2:3' };
  const activeGrp = document.querySelector('.chip-group.active');
  let ratio = '1:1';
  if (activeGrp) { const c = activeGrp.querySelector('.chip.solo.on'); if (c) { const t = c.textContent.trim(); if (ratioMap[t]) ratio = t; } }

  const resp = await fetch('https://profi-brand-generator.vercel.app/api/krea', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt, kreaKey, aspectRatio: ratio })
  });

  const data = await resp.json();
  if (data.error) throw new Error(data.error + (data.debug ? ' | DEBUG: ' + data.debug : ''));
  if (data.imageUrl) return data.imageUrl;
  throw new Error('Нет URL изображения в ответе');
}

function renderResultsWithImage(prompt, imageUrl) {
  renderResultsWithImages(prompt, [imageUrl]);
}

function renderResultsWithImages(prompt, imageUrls) {
  const grid = document.getElementById('results-grid');
  const isSingle = imageUrls.length === 1;
  grid.innerHTML = imageUrls.map((imageUrl, i) => `
    <div class="result-card${isSingle ? ' single' : ''}" onclick="openLightbox('${imageUrl}')">
      <img src="${imageUrl}" alt="Вариант ${i+1}">
    </div>
  `).join('');
}

function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox-download').href = url;
  document.getElementById('lightbox').classList.add('on');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('on');
}

  if (btn) { const orig = btn.textContent; btn.textContent = 'Скопировано!'; setTimeout(() => btn.textContent = orig, 2000); }

// ─── UI HELPERS ───
function showLoading(on) {
  document.getElementById('loading').className = 'loading-card' + (on ? ' on' : '');
  const btn = document.getElementById('gen-btn');
  btn.disabled = on;
  btn.classList.toggle('loading', on);
  document.getElementById('gen-btn-text').textContent = on ? 'Генерирую...' : 'Сгенерировать';
  if (on) { const es = document.getElementById('empty-state'); if (es) es.style.display = 'none'; }
}

function setLoadStep(step, text, sub) {
  document.getElementById('load-text').textContent = text;
  document.getElementById('load-sub').textContent = sub || '';
}

function showErr(msg) {
  const el = document.getElementById('err-card');
  el.textContent = '' + msg;
  el.classList.add('on');
}
function clearErr() { document.getElementById('err-card').classList.remove('on'); }
